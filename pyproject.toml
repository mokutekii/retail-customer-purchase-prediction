[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-purchase-prediction"
version = "0.1.0"
description = "Reproducible training pipeline for online retail purchase prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
notebooks = ["ipykernel>=6.29", "jupyterlab>=4.1", "seaborn>=0.13"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
retail-train = "retail_purchase.train:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
where = ["src"]
